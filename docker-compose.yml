version: '3.8'

services:
  geospatial-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial_measurement_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
    environment:
      - PROJECT_NAME=Geospatial File Measurement API
      - MAX_FILE_SIZE_MB=50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
